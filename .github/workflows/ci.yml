name: CI

on:
  push:
    pull_request:
      workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
  runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v7

  - name: Set up JDK
    uses: actions/setup-java@v6
    with:
      distribution: temurin
      java-version: '27'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v6

  - name: Compile debug APK
    run: ./gradlew assembleDebug
